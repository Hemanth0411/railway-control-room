# Builds the Sandbox image and pushes it to GHCR.
#
# Runs here rather than locally so publishing needs no Docker install and no long-lived
# registry credentials - GITHUB_TOKEN is scoped to this repo and expires with the job.
name: Sandbox image

on:
  push:
    branches: [main]
    paths:
      - 'sandbox/**'
      - '.github/workflows/sandbox-image.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Docker registry paths must be lowercase, and GitHub usernames are not. Derive it
      # rather than hard-coding, so this keeps working if the repo moves.
      - name: Lowercase the owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./sandbox
          push: true
          # A moving 'latest' plus an immutable commit tag. Railway pulls latest; the sha
          # tag is there so a running deployment can be traced back to a commit.
          tags: |
            ghcr.io/${{ env.OWNER }}/control-room-sandbox:latest
            ghcr.io/${{ env.OWNER }}/control-room-sandbox:${{ github.sha }}
